<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- Core Web Vitals Preloads -->
    <link rel="preload" as="image" href="/images/glowing_globe.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/logo-new.png" fetchpriority="high" />
    <!-- Primary Meta Tags -->
    <title>Skavelon</title>
    <link rel="icon" type="image/png" href="/logo-new.png?v=3" />
    <meta name="title" content="Skavelon" />
    <meta name="description" content="Skavelon Technologies empowers global commerce through integrated trade facilitation (LePort) and advanced cybersecurity &amp; IT solutions (Cybersecurity)." />
    <meta name="keywords" content="Skavelon Technologies, Global Trade, Export Facilitation, Cybersecurity, IT Solutions, Zero-Trust Security, Data Loss Prevention" />
    <meta name="author" content="Skavelon Technologies" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://leak-qoara.vercel.app/" />
    <meta property="og:title" content="Skavelon Technologies" />
    <meta property="og:description" content="Skavelon Technologies empowers global commerce through integrated trade facilitation and advanced cybersecurity solutions." />
    <meta property="og:image" content="https://leak-qoara.vercel.app/logo-new.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://leak-qoara.vercel.app/" />
    <meta property="twitter:title" content="Skavelon Technologies" />
    <meta property="twitter:description" content="Skavelon Technologies empowers global commerce through integrated trade facilitation and advanced cybersecurity solutions." />
    <meta property="twitter:image" content="https://leak-qoara.vercel.app/logo-new.png" />
    
    <link rel="canonical" href="https://leak-qoara.vercel.app/" />
    <link rel="icon" type="image/png" href="/logo-small.png" />
    <link rel="apple-touch-icon" href="/logo-small.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Inline critical CSS to prevent flash -->
    <style>
      body {
        margin: 0;
        background-color: #050505;
        color: #ffffff;
        font-family: 'Poppins', sans-serif;
      }
      #root {
        background-color: #050505;
        min-height: 100vh;
      }
    </style>

    <!-- DNS prefetch for external domains (zero-RTT early connection) -->
    <link rel="dns-prefetch" href="https://vitals.vercel-insights.com" />
    <link rel="dns-prefetch" href="https://va.vercel-scripts.com" />
    <link rel="dns-prefetch" href="https://api.emailjs.com" />

    <!-- Preload critical fonts locally to prevent CLS and speed up FCP -->
    <link rel="preload" href="/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfairdisplay-700.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="preload" href="/images/glowing_globe.webp" imagesrcset="/images/glowing_globe-small.webp 450w, /images/glowing_globe.webp 900w" imagesizes="(max-width: 640px) 450px, 900px" as="image" fetchpriority="high" />
  </head>

  <body>
    <div id="root">
      <h1>Skavelon Technologies</h1>
    </div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-family:sans-serif;">' +
          '<h3>Critical Initialization Error</h3>' +
          '<p><strong>Message:</strong> ' + msg + '</p>' +
          '<p><strong>File:</strong> ' + url + ':' + line + ':' + col + '</p>' +
          '<pre>' + (error ? error.stack : '') + '</pre>' +
        '</div>';
      };
      window.addEventListener("unhandledrejection", function(event) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-family:sans-serif;">' +
          '<h3>Unhandled Promise Rejection</h3>' +
          '<p><strong>Reason:</strong> ' + (event.reason ? event.reason.toString() : 'Unknown') + '</p>' +
          '<pre>' + (event.reason && event.reason.stack ? event.reason.stack : '') + '</pre>' +
        '</div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>

  </body>

</html>
